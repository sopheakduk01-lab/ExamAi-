<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Chocolate/Scholastic Brown -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#5a3410" />
      <stop offset="100%" stop-color="#3b2006" />
    </radialGradient>

    <!-- Gold Border Gradient for Outer Border -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d19c3b" />
      <stop offset="50%" stop-color="#b27d26" />
      <stop offset="100%" stop-color="#916116" />
    </linearGradient>

    <!-- Badge Yellow Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#febb12" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadows for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Base Background: Squircle rounded corner with Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)" />

  <!-- Center Open Book Icon (Beautifully rounded & symmetrical line art) -->
  <path d="M 256,350 L 256,220 C 220,220 180,195 160,195 C 140,195 120,205 120,205 L 120,315 C 120,315 140,305 160,305 C 180,305 220,330 256,330 C 292,330 332,305 352,305 C 372,305 392,315 392,315 L 392,205 C 392,205 372,195 352,195 C 332,195 292,220 256,220" 
        fill="none" stroke="#fedd8a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Overlapping Upper-Right Yellow/Gold Circular Badge -->
  <circle cx="345" cy="165" r="76" fill="url(#badgeGrad)" stroke="#fef9c3" stroke-width="4" filter="url(#shadow)" />

  <!-- Dark Chocolate Brown Light Bulb inside the Badge -->
  <g transform="translate(345, 165) scale(1.1)" stroke="#3b2006" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bulb Dome & Neck -->
    <path d="M -16,-12 C -16,-30 -8,-36 0,-36 C 8,-36 16,-30 16,-12 C 16,0 10,7 10,16 L -10,16 C -10,7 -16,0 -16,-12 Z" />
    <!-- Filament Line -->
    <path d="M 0,-18 L 0,-6" />
    <!-- Metal Base Thread lines -->
    <path d="M -7,22 L 7,22" />
    <path d="M -4,28 L 4,28" />
  </g>
</svg>
