<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.3" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Background (iOS/Android rounded Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGradient)" filter="url(#shadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="none" stroke="#fef3c7" stroke-width="4" stroke-opacity="0.4" />

  <!-- Background Pattern Accents (Stars & Rays) -->
  <circle cx="90" cy="110" r="16" fill="#ffffff" opacity="0.25" />
  <circle cx="420" cy="100" r="12" fill="#ffffff" opacity="0.3" />
  <circle cx="430" cy="390" r="20" fill="#ffffff" opacity="0.2" />

  <!-- Graduation Cap & Book Illustration Group -->
  <g transform="translate(0, -10)">
    <!-- Open Book Base -->
    <path d="M 120 310 Q 256 280 392 310 L 392 375 Q 256 345 120 375 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 130 300 Q 256 270 382 300 L 382 360 Q 256 330 130 360 Z" fill="#ffffff" />
    <!-- Book Spine Divider -->
    <path d="M 256 272 L 256 362" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

    <!-- Graduation Mortarboard Cap -->
    <!-- Cap Shadow -->
    <polygon points="256,120 400,180 256,230 112,180" fill="#0f172a" opacity="0.2" transform="translate(0, 10)" />

    <!-- Cap Top Diamond -->
    <polygon points="256,110 400,175 256,230 112,175" fill="#1e293b" />
    <polygon points="256,115 385,175 256,223 127,175" fill="#334155" />

    <!-- Cap Skull Base -->
    <path d="M 176 195 L 176 240 C 176 270 336 270 336 240 L 336 195 Z" fill="#0f172a" />
    <path d="M 184 200 L 184 235 C 184 260 328 260 328 235 L 328 200 Z" fill="#1e293b" />

    <!-- Cap Tassel Button -->
    <ellipse cx="256" cy="170" rx="14" ry="8" fill="url(#goldGrad)" />

    <!-- Cap Tassel String & Hanging Gold Tassel -->
    <path d="M 256 170 Q 340 180 360 230" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round" />
    <polygon points="352,230 368,230 372,280 348,280" fill="url(#goldGrad)" />
    <circle cx="360" cy="230" r="7" fill="#f59e0b" />
  </g>

  <!-- Grade 6 Badge (ថ្នាក់ទី៦) Circle -->
  <g transform="translate(256, 385)" filter="url(#glow)">
    <circle cx="0" cy="0" r="68" fill="url(#badgeGrad)" stroke="#f59e0b" stroke-width="6" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Khmer Grade 6 Badge Text -->
    <text x="0" y="-8" text-anchor="middle" fill="#92400e" font-family="'Siemreap', 'Moul', sans-serif" font-weight="bold" font-size="22">
      ថ្នាក់ទី
    </text>
    <text x="0" y="32" text-anchor="middle" fill="#b45309" font-family="'Moul', 'Siemreap', sans-serif" font-weight="bold" font-size="38">
      ៦
    </text>
  </g>
</svg>
